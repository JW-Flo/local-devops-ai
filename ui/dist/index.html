<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Local DevOps AI — Unified Console</title>
<style>
  :root {
    --bg:#0b0f17; --panel:#141b27; --panel2:#1b2434; --line:#243044;
    --txt:#e6edf6; --muted:#8aa0b8; --accent:#4f9dff; --good:#3fb950;
    --bad:#f85149; --warn:#d29922; --chip:#22304a;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
    font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:16px 24px;
    border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; font-weight:650; letter-spacing:.2px; }
  .prov-badge { background:var(--chip); color:var(--accent); padding:3px 10px;
    border-radius:999px; font-size:12px; font-weight:600; }
  .spacer { flex:1; }
  #updated { color:var(--muted); font-size:12px; }
  main { padding:24px; display:grid; gap:20px; max-width:1200px; margin:0 auto; }
  .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:.6px;
    color:var(--muted); margin:0 0 12px; font-weight:650; }
  .svc { display:flex; align-items:center; gap:10px; }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .dot.up { background:var(--good); box-shadow:0 0 8px var(--good); }
  .dot.down { background:var(--bad); box-shadow:0 0 8px var(--bad); }
  .svc .name { font-weight:600; text-transform:capitalize; }
  .svc .url { color:var(--muted); font-size:12px; }
  .row { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--panel2); }
  .row:last-child { border-bottom:none; }
  .row .k { color:var(--muted); } .row .v { font-weight:600; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { background:var(--chip); padding:5px 11px; border-radius:8px; font-size:12.5px;
    border:1px solid var(--line); }
  .chip.hl { border-color:var(--accent); color:var(--accent); font-weight:650; }
  .pill { font-size:11px; padding:2px 8px; border-radius:999px; font-weight:650; }
  .pill.good { background:rgba(63,185,80,.15); color:var(--good); }
  .pill.warn { background:rgba(210,153,34,.15); color:var(--warn); }
  .pill.bad { background:rgba(248,81,73,.15); color:var(--bad); }
  .muted { color:var(--muted); }
  .wf { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--panel2); }
  .full { grid-column:1/-1; }
  a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<header>
  <h1>Local DevOps AI · Unified Console</h1>
  <span class="prov-badge" id="provider">—</span>
  <div class="spacer"></div>
  <span id="updated">connecting…</span>
</header>
<main id="root"><div class="muted">Loading dashboard…</div></main>
<script>
const $ = (h) => { const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstChild; };
const esc = (s) => String(s==null?'':s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const ago = (ts) => { if(!ts) return 'never'; const s=Math.round((Date.now()-ts)/1000);
  if(s<60) return s+'s ago'; if(s<3600) return Math.round(s/60)+'m ago'; return Math.round(s/3600)+'h ago'; };

function providerPill(p){
  if(p.disabled) return '<span class="pill bad">disabled</span>';
  if(p.recoveryMode) return '<span class="pill warn">recovery</span>';
  return '<span class="pill good">healthy</span>';
}

function kvRows(obj){
  if(!obj || typeof obj!=='object') return '<div class="muted">n/a</div>';
  return Object.entries(obj).map(([k,v])=>{
    if(v && typeof v==='object') v=JSON.stringify(v);
    return `<div class="row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`;
  }).join('') || '<div class="muted">—</div>';
}

function render(d){
  document.getElementById('provider').textContent = 'LLM: '+(d.gateway?.llmProvider||'?');
  document.getElementById('updated').textContent = 'updated '+new Date(d.timestamp).toLocaleTimeString();
  const root = document.getElementById('root'); root.innerHTML='';

  // Services
  const svc = $(`<section class="card full"><h2>Services</h2><div class="grid" id="svcgrid"></div></section>`);
  root.appendChild(svc);
  const sg = svc.querySelector('#svcgrid');
  (d.services||[]).forEach(s=>{
    sg.appendChild($(`<div class="card"><div class="svc"><span class="dot ${s.up?'up':'down'}"></span>
      <div><div class="name">${esc(s.name)}</div><div class="url">${esc(s.url)}</div></div></div>
      <div class="row" style="margin-top:10px"><span class="k">status</span>
      <span class="v">${s.up?'online':'offline'}</span></div>
      <div class="row"><span class="k">auto-heal</span><span class="v">${s.autoRestart?'yes':'monitor'}</span></div>
      <div class="row"><span class="k">last up</span><span class="v">${ago(s.lastUp)}</span></div></div>`));
  });

  // Two-column: providers + agent loop
  const providers = (d.providers||[]).map(p=>
    `<div class="row"><span class="k" style="text-transform:capitalize">${esc(p.name)}</span>
     <span class="v">${providerPill(p)}</span></div>`).join('');
  root.appendChild($(`<div class="grid">
    <section class="card"><h2>LLM Providers</h2>${providers||'<div class="muted">—</div>'}</section>
    <section class="card"><h2>Agent Loop</h2>${kvRows(d.agentLoop)}</section>
    <section class="card"><h2>Self-Healer</h2>
      <div class="row"><span class="k">total issues</span><span class="v">${d.healer?.totalIssues??0}</span></div>
      <div class="row"><span class="k">active requests</span><span class="v">${d.healer?.activeRequests??0}</span></div>
      ${kvRows(d.healer?.byCategory)}</section>
  </div>`));

  // Tool portfolio
  const chips = (d.tools||[]).map(t=>
    `<span class="chip ${t.name==='n8n'?'hl':''}" title="${esc(t.desc)}">${esc(t.name)}</span>`).join('');
  root.appendChild($(`<section class="card full"><h2>Agent Tool Portfolio (${(d.tools||[]).length})</h2>
    <div class="chips">${chips}</div></section>`));

  // n8n workflows
  let wfBody;
  if(!d.n8n?.reachable) wfBody='<div class="muted">n8n unreachable</div>';
  else if(!d.n8n?.apiKeyConfigured) wfBody='<div class="muted">reachable — API key not configured</div>';
  else if(!d.n8n.workflows?.length) wfBody='<div class="muted">no workflows yet — create one in the <a href="http://127.0.0.1:5678" target="_blank">n8n editor</a></div>';
  else wfBody=d.n8n.workflows.map(w=>`<div class="wf"><span class="dot ${w.active?'up':'down'}"></span>
    <span>${esc(w.name)}</span><span class="muted">#${esc(w.id)}</span></div>`).join('');
  root.appendChild($(`<section class="card full"><h2>n8n Workflows</h2>${wfBody}</section>`));

  // KPIs
  root.appendChild($(`<section class="card full"><h2>KPIs</h2>${kvRows(d.kpi)}</section>`));
}

async function tick(){
  try{
    const r = await fetch('/api/dashboard'); const j = await r.json();
    render(j);
  }catch(e){ document.getElementById('updated').textContent='fetch error: '+e.message; }
}
tick(); setInterval(tick, 10000);
</script>
</body>
</html>
